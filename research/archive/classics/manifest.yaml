archive: consmap_classics
status: index_only
purpose: >
  Preserve references to longer-form research artifacts that informed ConsMAP
  without treating them as canonical proof or mandatory doctrine.

policy:
  upload_binary_pdfs: requires_explicit_confirmation
  use_as_evidence: false
  use_as_pattern_library: true
  use_as_metaphor_engine: true
  use_as_claim_map_seed: true
  warning: >
    If an artifact becomes mandatory belief, it has switched from map to trap.

recommended_structure:
  cards: research/archive/classics/cards/
  attachments: research/archive/classics/attachments/
  indexes:
    - research/archive/classics/README.md
    - research/archive/classics/CLASSICS_INDEX.md

candidate_artifacts:
  - id: locked_system
    title: THE LOCKED SYSTEM FINAL
    suggested_role: core philosophy / map-trap-loop safety layer
    upload_status: not_uploaded
    companion_card: cards/locked_system.card.md

  - id: trampoline
