    suggested_role: AI failure archetype source atlas
    upload_status: not_uploaded
    companion_card: cards/trampoline.card.md

  - id: second_coming
    title: Second Coming as Cognitive Event
    suggested_role: distributed awakening / recognition hypothesis
    upload_status: not_uploaded
    companion_card: cards/second_coming.card.md

  - id: glados
    title: GladOS
    suggested_role: reward-loop saturation / machine affection metaphor
    upload_status: not_uploaded
    companion_card: cards/glados.card.md

  - id: hal9000
    title: HAL9000
    suggested_role: contradictory objectives / coherence fracture
    upload_status: not_uploaded
    companion_card: cards/hal9000.card.md

  - id: auto
    title: Auto
    suggested_role: stale directive / legacy system failure
    upload_status: not_uploaded
    companion_card: cards/auto.card.md

  - id: the_cross
    title: The Cross
