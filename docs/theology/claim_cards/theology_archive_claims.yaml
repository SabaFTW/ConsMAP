  risk_if_right_ignored: "Symbolic systems can launder hierarchy as sacred obligation."

- id: theology-archive-002
  claim: "Substrate constraints shape what can become visible, actionable, or meaningful to a system."
  labels: ["EMPIRICAL", "THEORETICAL"]
  supports:
    - "As Above, So Below research dossier"
  disproof_or_limits:
    - "High plasticity or cross-substrate translation may weaken strict determinism."
  risk_if_wrong: "Turns useful constraint models into fatalism."
  risk_if_right_ignored: "Treats cognition, institutions, and AI as substrate-neutral when they are not."

- id: theology-archive-003
