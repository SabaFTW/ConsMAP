<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ConsMAP Minimal Sanctuary Icon</title>
  <desc id="desc">Minimal green symbolic icon for ConsMAP: compass, map, and claim-boundary motif.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#112316"/>
      <stop offset="52%" stop-color="#0a120c"/>
      <stop offset="100%" stop-color="#060906"/>
    </radialGradient>
    <linearGradient id="ring" x1="120" y1="96" x2="388" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#95ffae"/>
      <stop offset="42%" stop-color="#6fcf85"/>
      <stop offset="100%" stop-color="#2f8d52"/>
    </linearGradient>
    <linearGradient id="core" x1="256" y1="152" x2="256" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a9ffbc"/>
      <stop offset="100%" stop-color="#5cb870"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.43 0 0 0 0 0.94 0 0 0 0 0.53 0 0 0 0.22 0" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- quiet ambient rails -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="#6fcf85" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#6fcf85" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="1 16" stroke-linecap="round"/>

  <!-- outer map/compass ring with intentional breaks -->
  <g fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" filter="url(#glow)">
    <path d="M157 105A194 194 0 0 1 355 105"/>
    <path d="M407 157A194 194 0 0 1 407 355"/>
    <path d="M355 407A194 194 0 0 1 157 407"/>
    <path d="M105 355A194 194 0 0 1 105 157"/>
  </g>

  <!-- cardinal ticks -->
  <g stroke="#6fcf85" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round">
    <path d="M256 70v22"/>
    <path d="M420 256h22"/>
    <path d="M256 420v22"/>
    <path d="M70 256h22"/>
  </g>

  <!-- small nodes / claim points -->
  <g filter="url(#glow)">
    <circle cx="256" cy="82" r="8" fill="#95ffae"/>
    <circle cx="430" cy="256" r="6.5" fill="#6fcf85"/>
    <circle cx="256" cy="430" r="8" fill="#95ffae"/>
    <circle cx="82" cy="256" r="6.5" fill="#6fcf85"/>
  </g>

  <!-- central sanctuary / map needle -->
  <g filter="url(#glow)">
    <path d="M256 138
             C225 176 207 215 207 253
             C207 315 252 361 256 373
             C260 361 305 315 305 253
             C305 215 287 176 256 138Z"
          fill="#0d1d11" stroke="url(#ring)" stroke-width="10" stroke-linejoin="round"/>

    <path d="M256 170
             C236 198 226 224 226 251
             C226 294 248 321 256 334
             C264 321 286 294 286 251
             C286 224 276 198 256 170Z"
          fill="url(#core)" opacity="0.16"/>

    <!-- split/mirror line -->
    <path d="M256 176V318" stroke="#95ffae" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

    <!-- horizontal boundary bar -->
    <path d="M222 257H290" stroke="#95ffae" stroke-width="6" stroke-linecap="round" opacity="0.72"/>

    <!-- eye / discernment aperture -->
    <path d="M228 228C242 216 270 216 284 228C270 241 242 241 228 228Z" fill="#95ffae" opacity="0.88"/>
    <circle cx="256" cy="228" r="5" fill="#0a120c"/>
  </g>

  <!-- subtle north star / meaning anchor -->
  <g fill="none" stroke="#6fcf85" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M256 110l12 24 24 12-24 12-12 24-12-24-24-12 24-12z"/>
  </g>

  <!-- soft lower diamond, archive / claim card hint -->
  <g fill="none" stroke="#6fcf85" stroke-opacity="0.58" stroke-width="5" stroke-linejoin="round">
    <path d="M256 356l18 20-18 20-18-20z"/>
    <path d="M256 378l10 11-10 11-10-11z"/>
  </g>
</svg>
