<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Continuum Arc · ConsMAP</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #070b07;
      --panel: rgba(15,23,18,.72);
      --text: #dceadc;
      --muted: rgba(220,234,220,.65);
      --dim: rgba(220,234,220,.38);
      --accent: #6fcf85;
      --accent2: #c4b5fd;
      --line: rgba(124,176,138,.18);
      --line2: rgba(124,176,138,.10);
      --mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .amb {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(196,181,253,.09), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(111,207,133,.07), transparent 30%),
        linear-gradient(180deg, #070b07, #0b0d12 60%, #060806);
    }
    .grid-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.013) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(circle at 50% 15%, black, transparent 68%);
      mask-image: radial-gradient(circle at 50% 15%, black, transparent 68%);
    }

    .wrap {
      position: relative; z-index: 1;
      max-width: 740px;
      margin: 0 auto;
      padding: 48px 20px 100px;
    }

    .crumbs {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 36px;
      display: flex; gap: 8px; align-items: center;
    }
    .crumbs a { color: var(--accent); text-decoration: none; transition: color .2s; }
    .crumbs a:hover { color: var(--text); }
    .crumbs .sep { color: var(--line); }

    .kicker {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(196,181,253,.55);
      margin-bottom: 40px;
    }

    /* markdown content */
    #content h1 {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 300;
      letter-spacing: -.03em;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 14px;
      margin-top: 48px;
    }
    #content h1:first-child { margin-top: 0; }
    #content h2 {
      font-size: 18px;
      font-weight: 400;
      color: rgba(220,234,220,.9);
      margin-top: 40px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line2);
    }
    #content h3 {
      font-size: 14px;
      font-weight: 500;
      color: rgba(220,234,220,.8);
      margin-top: 28px;
      margin-bottom: 8px;
      font-family: var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    #content p {
      font-size: 15px;
      line-height: 1.85;
      color: var(--muted);
      margin-bottom: 16px;
    }
    #content ul, #content ol {
      margin-bottom: 16px;
      padding-left: 22px;
    }
    #content li {
      font-size: 14px;
      line-height: 1.75;
      color: rgba(220,234,220,.68);
      margin-bottom: 4px;
    }
    #content blockquote {
      border-left: 2px solid rgba(196,181,253,.35);
      padding: 10px 18px;
      margin: 20px 0;
      background: rgba(196,181,253,.04);
      border-radius: 0 10px 10px 0;
    }
    #content blockquote p {
      color: rgba(220,234,220,.62);
      font-style: italic;
      margin-bottom: 0;
    }
    #content hr {
      border: none;
      border-top: 1px solid var(--line2);
      margin: 36px 0;
    }
    #content strong { color: var(--text); font-weight: 600; }
    #content em { color: rgba(220,234,220,.75); font-style: italic; }
    #content code {
      font-family: var(--mono);
      font-size: 12px;
      background: rgba(111,207,133,.1);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
    }
    #content pre {
      background: rgba(10,14,10,.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    #content pre code { background: none; padding: 0; color: var(--muted); }
    #content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 13px;
    }
    #content th {
      text-align: left;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(196,181,253,.65);
      padding: 8px 12px;
      border-bottom: 1px solid rgba(196,181,253,.2);
    }
    #content td {
      padding: 8px 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--line2);
    }
    #content a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: rgba(111,207,133,.35);
    }
    #content a:hover { color: var(--text); }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40vh;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(196,181,253,.4);
      letter-spacing: .2em;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }

    footer {
      margin-top: 80px;
      padding-top: 20px;
      border-top: 1px solid var(--line2);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 600px) {
      .wrap { padding: 32px 16px 80px; }
    }
  </style>
</head>
<body>
  <div class="amb"></div>
  <div class="grid-bg"></div>
  <div class="wrap">
    <nav class="crumbs">
      <a href="../">← back</a>
    </nav>
    <p class="kicker">ConsMAP · Satire · Archive</p>
    <div id="content"><div class="loading">loading arc…</div></div>
    <footer>
      <span>ConsMAP · CC BY-SA 4.0</span>
      <a href="https://github.com/SabaFTW/ConsMAP">github.com/SabaFTW/ConsMAP</a>
    </footer>
  </div>
  <script>
    fetch('./index.md')
      .then(r => r.ok ? r.text() : Promise.reject('not found'))
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(() => {
        document.getElementById('content').innerHTML =
          '<p style="color:rgba(220,234,220,.4);font-family:monospace">Could not load arc document.</p>';
      });
  </script>
</body>
</html>
