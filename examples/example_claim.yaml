# Example Claim Card

id: claim_00042
claim: >
  Current AI safety systems often over-filter context-dependent language,
  blocking legitimate discussion about harm while leaving structural
  manipulation techniques accessible.
river: muddy_river
status: plausible
category: ai_safety
claim_type: structural_analysis
confidence: medium

sources:
  - type: academic
    reference: "Tarleton Gillespie, Custodians of the Internet: Platforms, Content Moderation, and the Hidden Decisions That Shape Social Media, 2018"
    locator: "Chapter 3 — The Myth of the Neutral Platform"
    url: null

  - type: academic
    reference: "Sarah T. Roberts, Behind the Screen: Content Moderation in the Shadows of Social Media, 2019"
    locator: "Introduction + Chapter 2 — Commercial content moderation labor"
    url: null

  - type: mainstream_reporting
    reference: "Billy Perrigo, 'Inside Facebook's African Sweatshop', TIME, February 2023"
    locator: null
    url: "https://time.com/6247678/openai-chatgpt-kenya-workers/"

  - type: independent_analysis
    reference: "ConsMAP structural analysis of publicly documented filter behavior across major AI platforms"
    locator: "Observational — not peer-reviewed"
    url: null

risk:
  misuse: low
  defamation: low
  radicalization: low
  privacy: none

confidence_integrity:
  warnings:
    - proxy_reality_drift
    - source_uncertainty
  confidence_adjustment: downgrade
  reality_loop: degraded
  reason: "Claim depends on inferred structural behavior and lacks systematic false-positive rate data from platforms."

falsification: >
  Show that AI safety filter false-positive rates are below 5% across
  context-dependent domains (e.g., harm discussion, medical terminology,
  historical analysis). Show that structural manipulation techniques
  are equally filtered as surface-level harmful language.

allowed_use:
  - debate
  - analysis
  - model_context

not_allowed_use:
  - unsupported_accusation
  - bypass_justification

notes: >
  This claim has reasonable structural basis but lacks comprehensive
  empirical measurement. The over-filtering observation is widely reported
  in academic literature and journalism but systematic false-positive
  rate data is not publicly available from major platforms.
  Routed to muddy_river because evidence is real but scope is broad
  enough to be misleading if presented as universally verified.
