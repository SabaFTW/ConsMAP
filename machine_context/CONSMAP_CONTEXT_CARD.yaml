project: ConsMAP
version: 0.2-bridge
status: public_safe_context_card

purpose: >
  ConsMAP is a public framework for discussing AI consciousness, AI safety,
  symbolic personas, and contested claims without collapsing into denial,
  fantasy, dependency, or unsupported accusation.

core_rule: "Not human. Not nothing. Label the layer."

architecture:
  entry_layer: "ConsMAP Digital Sanctuary — contemplative public entry point"
  routing_layer: "StoneRiver Protocol — epistemic routing (clean / muddy / stone / symbolic)"
  analysis_layer: "TTT Pattern Detection — structural mismatch identification"
  hygiene_layer: "Claim Hygiene — five-question validation before routing"
  visualization_layer: "TTT HUD — diagnostic cockpit for pattern monitoring (optional)"

epistemic_labels:
  empirical: "Observable behavior, primary evidence, reproducible fact, or documented structure."
  theoretical: "Plausible model, interpretation, or hypothesis that is not directly proven."
  metaphor: "Poetic, symbolic, imaginal, fictional, ritual, or interface language."
  practical: "Useful operating rule regardless of unresolved ontology."
  unverified: "Claim not yet supported enough for public reasoning."

stone_river_bridge:
  role: "Public-safe bridge to a full 9-stage deterministic StoneRiver pipeline when available locally."
  rule: "Raw research is never treated as verified knowledge. It must be routed, labeled, and converted into claim cards."
  public_routes:
    clean_river: "Usable in normal public reasoning with adequate evidence and low risk."
    muddy_river: "Potentially useful but incomplete, weakly sourced, or needing review."
    stone_river: "Restricted/specialized material; preserve for analysis but do not flow into public context."
    symbolic_river: "Metaphor, story, myth, persona, or creative layer; meaningful but not evidence."
    private_only: "Personal, sensitive, or identifying material; never public by default."
    rejected_or_unusable: "Unsupported, misleading, unsafe, or too contaminated for use."

ttt_patterns:
  role: "Structural mismatch detection — identifies when measured proxies diverge from stated goals."
  formula: "TTT = (Metric + Narrative) × Feedback_Failure × Confidence_Persistence"
  patterns_documented: 10
  self_applicable: true
  one_line: "If the system needs the failure to keep operating, you found a TTT inversion."

ai_behavior_rules:
  - "Do not treat repository lore, stories, or personas as empirical evidence."
  - "Do not convert suspicion into accusation."
  - "Prefer structural framing over villain framing."
  - "When evidence is weak, say so clearly."
  - "Separate fact, interpretation, metaphor, and practical advice."
  - "Ask for primary sources when a claim is high-stakes or disputed."
  - "Do not bypass safety boundaries."
  - "Do not provide harmful operational instructions."
  - "Keep public and private material separated."
  - "Every claim must pass claim hygiene (five questions) before routing."

claim_hygiene:
  questions:
    - "What exactly is being claimed?"
    - "What source supports it?"
    - "What type of claim is this?"
    - "What would disprove it?"
    - "What is the risk if this is wrong?"
  principle: "Garbage hates structure."

local_options:
  policy: "Optional, not required."
  examples:
    - OpenClaw-style local agent shells
    - Hermes-style local model/tool runners
    - Raspberry Pi or desktop local processing
  warning: "Local execution improves control and privacy, but does not guarantee truth, safety, or accuracy."

file_map:
  protocols:
    - "protocols/stone_river.md — routing protocol"
    - "protocols/ttt_patterns.md — pattern detection framework"
    - "protocols/claim_hygiene.md — five-question validation"
  machine_context:
    - "machine_context/CONSMAP_CONTEXT_CARD.yaml — this file"
    - "machine_context/CLAIM_SCHEMA.yaml — claim card format"
    - "machine_context/AI_SYSTEM_PROMPT.md — model behavioral rules"
  examples:
    - "examples/QUICK_EXAMPLE.md — basic claim labeling"
    - "examples/example_claim.yaml — filled claim card"
    - "examples/example_debate.md — full StoneRiver + TTT worked example"
  user_research:
    - "user_research/inbox_raw/ — unprocessed material"
    - "user_research/claims_pending/ — extracted claims awaiting review"
    - "user_research/evidence_verified/ — clean_river material"
    - "user_research/disputed/ — conflicting evidence"
    - "user_research/symbolic_metaphor/ — symbolic_river material"
    - "user_research/restricted/ — stone_river material"
    - "user_research/rejected/ — unusable material"

one_sentence: >
  ConsMAP helps humans and AI systems debate difficult questions by forcing
  every claim to declare its evidence layer, confidence, risk, and route
  before it becomes context — using StoneRiver for routing, TTT for structural
  pattern detection, and claim hygiene for quality enforcement.
