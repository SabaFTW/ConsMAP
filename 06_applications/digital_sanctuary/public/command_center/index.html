.md table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.6}

.md tr{transition:background .3s}

  <span style="font-size:.88rem;line-height:1.6;color:rgba(216,232,216,.85)">${esc(t.text)}</span></div>`;
function simTick(){
  const m=MEMBERS[Math.floor(Math.random()*MEMBERS.length)];
  const t={who:m.name,color:m.color,text:m.t[Math.floor(Math.random()*m.t.length)],
    time:new Date().toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit',second:'2-digit'})};
  S.thoughts.unshift(t);S.thoughts=S.thoughts.slice(0,40);
  const st=document.getElementById('stream');
  if(st){document.getElementById('streamEmpty').style.display='none';
    st.insertAdjacentHTML('afterbegin',thoughtHTML(t));
    while(st.children.length>40)st.lastChild.remove();}
  if(S.activeMember){const old=document.getElementById('mb-'+S.activeMember);
    if(old){const om=MEMBERS.find(x=>x.name===S.activeMember);old.style.setProperty('--b',om.color+'33');old.style.boxShadow='none';}}
  S.activeMember=m.name;
  const el=document.getElementById('mb-'+m.name);
  if(el){el.style.setProperty('--b',m.color+'cc');el.style.boxShadow=`0 4px 30px ${m.color}44`;
    clearTimeout(S.hl);S.hl=setTimeout(()=>{el.style.setProperty('--b',m.color+'33');el.style.boxShadow='none';S.activeMember=null;},2000);}
}

/* ===== ČAROVNIJA markdown ===== */
function inline(s,c){return esc(s)
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/\*([^*]+)\*/g,'<em>$1</em>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
function renderMarkdown(md){
  const out=[],lines=md.replace(/<!--[\s\S]*?-->/g,'').split('\n');let i=0;
  while(i<lines.length){const L=lines[i];
    if(L.startsWith('```')){const lang=L.slice(3).trim(),buf=[];i++;
      while(i<lines.length&&!lines[i].startsWith('```'))buf.push(lines[i++]);i++;
      out.push(`<div class="preWrap">${lang?`<span class="langpill">${esc(lang)}</span>`:''}<pre>${esc(buf.join('\n'))}</pre></div>`);continue;}
    if(/^---+\s*$/.test(L)){out.push('<hr>');i++;continue;}
    const hm=L.match(/^(#{1,4})\s+(.*)/);
    if(hm){const l=hm[1].length;out.push(`<h${l}>${inline(hm[2])}</h${l}>`);i++;continue;}
    if(/^\s*\|/.test(L)){const rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){
        const cells=lines[i].trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
        if(!cells.every(c=>/^:?-{2,}:?$/.test(c)))rows.push(cells);i++;}
      if(rows.length){const[h,...b]=rows;
        out.push(`<div class="tblWrap"><table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${
          b.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);}
      continue;}
    if(/^\s*[-*]\s+/.test(L)||/^\s*\d+\.\s+/.test(L)){const items=[];
      while(i<lines.length&&(/^\s*[-*]\s+/.test(lines[i])||/^\s*\d+\.\s+/.test(lines[i])))items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));
      out.push(`<ul>${items.map(it=>`<li><span class="fb">🔥</span>${inline(it)}</li>`).join('')}</ul>`);continue;}
    if(/^>\s?/.test(L)){const buf=[];
      while(i<lines.length&&/^>\s?/.test(lines[i]))buf.push(lines[i++].replace(/^>\s?/,''));
      out.push(`<blockquote>${buf.map(b=>inline(b)).join('<br>')}</blockquote>`);continue;}
    if(L.trim()===''){i++;continue;}
    const buf=[L];i++;
    while(i<lines.length&&lines[i].trim()!==''&&!/^(#|```|---|>|\s*\||\s*[-*]\s|\s*\d+\.)/.test(lines[i]))buf.push(lines[i++]);
    out.push(`<p>${buf.map(b=>inline(b)).join(' ')}</p>`);}
  return out.join('');}
function openDoc(id){
  const d=DOCS.find(x=>x.id===id);
  if(!d){S.view='docs';render();return;}
  S.view='reader';S.activeDoc=id;
  const c=CAT[d.category];
  app.innerHTML=`<div class="view">${backLink('docs')}<div class="md" style="--acc:${c}"><p style="color:rgba(216,232,216,.42);font-style:italic">Nalagam…</p></div></div>`;
  fetch(d.file).then(r=>{if(!r.ok)throw 0;return r.text()}).then(md=>{
    if(S.activeDoc!==id)return;
    app.querySelector('.md').innerHTML=renderMarkdown(md);
  }).catch(()=>{const el=app.querySelector('.md');if(el)el.innerHTML='<p style="color:#f87171">Napaka pri nalaganju dokumenta.</p>';});
}

/* ===== render ===== */
function render(){
  if(S.view==='home')app.innerHTML=homeView();
  else if(S.view==='pantheon'){app.innerHTML=pantheonView();
    document.getElementById('bStart').onclick=()=>{if(S.simTimer)return;simTick();S.simTimer=setInterval(simTick,3000);};
    document.getElementById('bPause').onclick=()=>{clearInterval(S.simTimer);S.simTimer=null;};
    document.getElementById('bClear').onclick=()=>{S.thoughts=[];const st=document.getElementById('stream');st.innerHTML='';document.getElementById('streamEmpty').style.display='';};}
  else if(S.view==='docs')app.innerHTML=docsView();
  else if(S.view==='library'){app.innerHTML=libraryView();
    const q=document.getElementById('q');
    q.oninput=e=>{S.query=e.target.value;document.getElementById('portalGrid').innerHTML=portalCards();};}
  window.scrollTo(0,0);
}

/* ===== particles ===== */
(function(){
  const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
  const fit=()=>{canvas.width=innerWidth;canvas.height=innerHeight};fit();addEventListener('resize',fit);
  const colors=['111,207,133','196,160,80','125,211,252'];
  const mk=()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+.6,
    sp:Math.random()*.25+.06,dx:(Math.random()-.5)*.12,o:Math.random()*.3+.08,
    c:colors[Math.floor(Math.random()*colors.length)],ph:Math.random()*Math.PI*2});
  const parts=Array.from({length:55},mk);
  (function tick(t){ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const p of parts){p.y-=p.sp;p.x+=p.dx;
      if(p.y<-5)Object.assign(p,mk(),{y:canvas.height+5});
      ctx.globalAlpha=p.o*(.6+.4*Math.sin(t/1600+p.ph));ctx.fillStyle=`rgb(${p.c})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;requestAnimationFrame(tick);})(0);
})();

/* ===== Ghost Mode (Konami) ===== */
(function(){
  const seq=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let buf=[];
  addEventListener('keydown',e=>{buf=[...buf,e.key].slice(-10);
    if(buf.join(',')===seq.join(',')){const g=document.getElementById('ghost');
      g.style.display='flex';setTimeout(()=>g.style.display='none',8000);}});
})();
