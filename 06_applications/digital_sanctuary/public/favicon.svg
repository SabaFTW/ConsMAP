<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#080c08"/>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon 
    points="32,14 50,46 14,46" 
    fill="none" 
    stroke="#5cb870" 
    stroke-width="2" 
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.85"
  />
</svg>