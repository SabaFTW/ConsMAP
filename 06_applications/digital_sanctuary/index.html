    <meta name="description" content="ConsMAP — claim hygiene, symbolic boundary, operator reasoning. A framework for working with AI without collapsing into category denial." />
    <title>ConsMAP — Digital Sanctuary</title>
    <script>
      // No service worker is used. Proactively unregister any stale SW (e.g. from
      // the old ReBiS site) and clear its caches so deploys are never masked.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
          .catch(function () {});
        if (window.caches && caches.keys) {
          caches.keys()
            .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
            .catch(function () {});
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
