name: Deploy Sanctuary to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './06_applications/digital_sanctuary/package-lock.json'

      - name: Install dependencies
        working-directory: ./06_applications/digital_sanctuary
        run: npm ci

      - name: Build
        working-directory: ./06_applications/digital_sanctuary
        run: npm run build

      - name: Sync app into docs/
        run: |
          cp 06_applications/digital_sanctuary/dist/index.html docs/index.html
          rm -rf docs/assets
          cp -r 06_applications/digital_sanctuary/dist/assets docs/assets
          cp -r 06_applications/digital_sanctuary/dist/forge_faq/. docs/forge_faq/
          mkdir -p docs/saga_map
          cp -r 06_applications/saga_map/. docs/saga_map/
          for f in favicon.png favicon.svg icon-192.png icons.svg site.webmanifest; do
            [ -f "06_applications/digital_sanctuary/dist/$f" ] && cp "06_applications/digital_sanctuary/dist/$f" "docs/$f" || true
          done

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "No changes to docs, skipping commit." && exit 0
          git commit -m "ci: update docs build [skip ci]"
          git push
