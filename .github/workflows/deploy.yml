name: Deploy Sanctuary to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './06_applications/digital_sanctuary/package-lock.json'

      - name: Install dependencies
        working-directory: ./06_applications/digital_sanctuary
        run: npm ci

      - name: Build
        working-directory: ./06_applications/digital_sanctuary
        run: npm run build

      - name: Add saga_map to build
        run: cp -r 06_applications/saga_map/. 06_applications/digital_sanctuary/dist/saga_map/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./06_applications/digital_sanctuary/dist
          publish_branch: gh-pages
